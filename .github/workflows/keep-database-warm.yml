name: Keep database warm

# mayomilesql1 (Azure SQL Serverless) auto-pauses after 60 minutes of
# inactivity, and resuming from pause takes 20-50+ seconds. Confirmed via
# Application Insights request timing: getLoads/getMostRecentLoad/
# getWeeklyTotals were stalling 20-52s in a clear bimodal pattern (fast
# when warm, ~45-52s when not), clustered right around the app's 45s SQL
# timeout. Pinging a lightweight, unauthenticated endpoint (api/ping —
# see pingDb.ts) regularly during business hours keeps the database from
# ever reaching that 60-minute threshold while people are actually using
# the dashboard, without raising the auto-pause delay itself (which would
# also keep it warm overnight, at higher cost, when nobody's using it).
on:
  schedule:
    # Every 30 minutes — comfortably under the 60-minute auto-pause window
    # even allowing for GitHub's scheduling jitter. Hours are UTC;
    # 10-23,0-2 covers roughly 4am-9pm Central across both standard and
    # daylight time, generously bracketing business hours.
    - cron: "*/30 10-23,0-2 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the keep-warm endpoint (with retries)
        run: |
          # A single failure here is usually the platform-level "stopped
          # host" instability documented in README.md's Known Issues, not
          # something this ping caused or can fix directly — it's a
          # transient, self-healing blip (the scheduled redeploy workflow
          # recycles the host every 6 hours regardless). Retrying a few
          # times in the same run means a passing blip doesn't have to wait
          # for the next 30-minute tick, and doesn't mark this run failed
          # for something that isn't actionable.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://dashboard.mayomile.com/api/ping")
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "All attempts failed."
          exit 1
