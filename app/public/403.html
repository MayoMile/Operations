<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Access Denied — MayoMile</title>
<style>
  :root {
    --paper: #f7f5f0;
    --surface: #ffffff;
    --border: #dcd8cc;
    --ink: #1f1b16;
    --ink-muted: #6b6455;
    --accent: #d96414;
    --accent-hover: #a34b0f;
    --negative: #b3432b;
    --negative-muted: #f6e2dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17140f;
      --surface: #231f18;
      --border: #3a352a;
      --ink: #f2ede2;
      --ink-muted: #b3a999;
      --negative-muted: #3a201b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 440px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
    text-align: center;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
  }
  .badge {
    display: inline-block;
    background: var(--negative-muted);
    color: var(--negative);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 12px;
  }
  p {
    color: var(--ink-muted);
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 24px;
  }
  a.button {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 22px;
    border-radius: 6px;
    transition: background 0.15s;
  }
  a.button:hover {
    background: var(--accent-hover);
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Access Denied</span>
    <h1>This account isn't authorized</h1>
    <p>
      You signed in successfully, but this Microsoft account isn't on the
      MayoMile Operations Dashboard's access list. If you believe this is a
      mistake, contact whoever manages this app's access to have your
      account added.
    </p>
    <a class="button" href="/.auth/logout?post_logout_redirect_uri=/">Sign out</a>
  </div>
</body>
</html>
